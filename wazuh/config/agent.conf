<agent_config>
  <!-- Sysmon events are not collected by default, this adds the channel. -->
  <localfile>
    <location>Microsoft-Windows-Sysmon/Operational</location>
    <log_format>eventchannel</log_format>
  </localfile>

  <!-- Agent-side SCA (CIS Windows benchmark) raises one alert per failed check, 300+ on a typical
       desktop, all above the webhook threshold. Same flood risk as the manager-side module, and
       out of scope for this project. See docs/decisions.md. -->
  <sca>
    <enabled>no</enabled>
  </sca>
</agent_config>
